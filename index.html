<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOY SIGAS | Gaming</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .contenedor {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .corona {
            font-size: 70px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 55px;
            font-weight: 900;
            letter-spacing: 5px;
            color: #d4af37;
            text-shadow:
                0 0 10px #d4af37,
                0 0 25px rgba(212, 175, 55, 0.6);
        }

        .subtitulo {
            margin-top: 15px;
            font-size: 18px;
            color: #cccccc;
            letter-spacing: 3px;
        }

        .redes {
            margin-top: 35px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 350px;
        }

        .boton {
            display: block;
            padding: 15px;
            border: 2px solid #d4af37;
            border-radius: 10px;
            color: #d4af37;
            text-decoration: none;
            font-weight: bold;
            font-size: 17px;
            transition: 0.3s;
        }

        .boton:hover {
            background: #d4af37;
            color: #050505;
            box-shadow: 0 0 20px #d4af37;
        }

        footer {
            margin-top: 50px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="corona">👑</div>

        <h1>SOY SIGAS</h1>

        <p class="subtitulo">
            GAMING • CREADOR • COMUNIDAD
        </p>

        <div class="redes">

            <a class="boton"
               href="https://www.instagram.com/soysigasofficial/"
               target="_blank">
                📸 Instagram — @soysigasofficial
            </a>

            <a class="boton"
               href="#"
               target="_blank">
                🎮 Próximamente
            </a>

            <a class="boton"
               href="#"
               target="_blank">
                ▶️ YouTube
            </a>

        </div>

        <footer>
            © 2026 SOY SIGAS — Todos los derechos reservados
        </footer>

    </div>

</body>
</html>
